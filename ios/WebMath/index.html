<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="katex/katex.min.css"><style>
html,body{margin:0;padding:0;height:auto;background:transparent;color:#1D2129;font-family:-apple-system,sans-serif}#output{font-size:16px;line-height:28px;white-space:pre-wrap;overflow-wrap:anywhere}.yb-formula{white-space:normal;background:#fff;border:1px solid #E2DED4;border-radius:10px;padding:12px;margin:12px 0;overflow-x:auto}.katex{font-size:1.06em}.katex-display{margin:0;text-align:left}.katex-display>.katex{text-align:left}.yb-inline-math{white-space:normal}
</style><script src="katex/katex.min.js"></script><script src="math-render.js"></script></head><body><div id="output"></div><script>
function reportHeight(){window.webkit.messageHandlers.mathHeight.postMessage(document.getElementById('output').getBoundingClientRect().height)}
window.showMath=function(payload){const el=document.getElementById('output');el.style.fontSize=payload.fontSize+'px';el.style.lineHeight=(payload.fontSize+12)+'px';el.innerHTML=StudentMath.render(payload.text,{cards:payload.cards});reportHeight();document.fonts.ready.then(reportHeight)};
new ResizeObserver(reportHeight).observe(document.getElementById('output'));
</script></body></html>
