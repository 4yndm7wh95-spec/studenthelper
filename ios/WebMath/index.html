<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="katex/katex.min.css"><style>
:root{color-scheme:light;--surface:#FFFFFF;--line:#E9DFC9;--line-strong:#D5C7A6;--ink:#221D14;--ink-2:#4A4132;--accent:#1D6B55;--marker:#FFEFB0;--marker-line:#FFE58A;--marker-edge:#F2DA7E;--marker-ink:#2B2200;--r-bubble:18px;--r-tail:6px;--r-formula:12px;--bubble-max:100%;--ease-out:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.37,0,.63,1);--font-ui:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
html,body{margin:0;padding:0;height:auto;background:transparent;color:var(--ink);font-family:var(--font-ui);-webkit-text-size-adjust:100%;-webkit-user-select:text}
#output{font-size:16px;line-height:1.625;letter-spacing:.02em;overflow-wrap:break-word}
#output.plain{white-space:pre-wrap}
.yb-formula{white-space:normal;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;overflow-x:auto}
.katex{font-size:1.06em}.katex-display{margin:0;text-align:left}.katex-display>.katex{text-align:left}.yb-inline-math{white-space:normal}
.yb-teacher{max-width:100%}
</style><link rel="stylesheet" href="reply-style.css"><link rel="stylesheet" href="claude-theme.css"><style>
html,body{background:transparent}
:root{--bubble-max:100%}
.yb-bubble{font-size:1em}
.yb-formula{background:var(--surface)}
</style><script src="katex/katex.min.js"></script><script src="math-render.js"></script></head><body><div id="output"></div><script>
const post=(name,v)=>window.webkit.messageHandlers[name]&&window.webkit.messageHandlers[name].postMessage(v);
let raf=0;function reportHeight(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>post('mathHeight',document.getElementById('output').getBoundingClientRect().height))}
let lastText='',ctl=null,lastSkip=0;
window.showMath=function(p){
 const el=document.getElementById('output');el.style.fontSize=p.fontSize+'px';
 if(lastText===p.text&&el.children.length){
  if(ctl&&(!p.paced||p.skip!==lastSkip)){ctl.skip();post('mathPace',false);ctl=null}
  lastSkip=p.skip||0;reportHeight();return}
 if(ctl){ctl.finish();ctl=null}
 lastText=p.text;lastSkip=p.skip||0;el.classList.toggle('plain',!p.structured);
 el.innerHTML=p.structured?StudentMath.structured(p.text):StudentMath.render(p.text,{cards:p.cards});
 if(p.structured&&p.paced){
  ctl=StudentMath.pace(el,{reduced:p.reduced,onReveal:i=>{reportHeight();if(i.done){ctl=null;post('mathPace',false)}}});
  post('mathPace',!!ctl&&ctl.state!=='complete');
 }
 reportHeight();document.fonts.ready.then(reportHeight);
};
new ResizeObserver(reportHeight).observe(document.getElementById('output'));
</script></body></html>
