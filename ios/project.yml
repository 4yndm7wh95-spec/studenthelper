name: StudentHelper
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.studenthelper.yibu
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "10"
    TARGETED_DEVICE_FAMILY: "2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  StudentHelper:
    type: application
    platform: iOS
    sources:
      - path: StudentHelper
      - path: WebMath
        type: folder
    info:
      path: StudentHelper/Info.plist
      properties:
        CFBundleDisplayName: 一步
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: 连接电脑上的学习服务以获取回复。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            10.0.0.0/8:
              NSExceptionAllowsInsecureHTTPLoads: true
            172.16.0.0/12:
              NSExceptionAllowsInsecureHTTPLoads: true
            192.168.0.0/16:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "10"
    scheme:
      testTargets:
        - StudentHelperTests
        - StudentHelperUITests
      gatherCoverageData: false
  StudentHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
    dependencies:
      - target: StudentHelper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studenthelper.yibu.tests
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  StudentHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: StudentHelper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studenthelper.yibu.uitests
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
