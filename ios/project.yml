name: StudentHelper
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.studenthelper.yibu
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  StudentHelper:
    type: application
    platform: iOS
    sources:
      - path: StudentHelper
      - path: WebMath
        type: folder
    info:
      path: StudentHelper/Info.plist
      properties:
        CFBundleDisplayName: 一步
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: 连接电脑上的学习服务以获取回复。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            10.0.0.0/8:
              NSExceptionAllowsInsecureHTTPLoads: true
            172.16.0.0/12:
              NSExceptionAllowsInsecureHTTPLoads: true
            192.168.0.0/16:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
      gatherCoverageData: false
